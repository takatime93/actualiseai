<!doctype html>
<html lang="en" data-concept="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actualise AI Word Lab</title>
<meta name="description" content="Lab: the ACTUALISE wordmark in 4,512 cubes.">
<script>(function(){var r=document.documentElement;if(location.pathname.indexOf('/identity/')<0&&/^#(idea|symbol|logo|colour|language|motion|in-use|next)$/.test(location.hash)){location.replace('identity/'+location.hash);return}try{var c=localStorage.getItem('aai-concept'),t=localStorage.getItem('aai-theme');if(c&&/^(ink|cobalt)$/.test(c))r.dataset.concept=c;if(t)r.dataset.theme=t}catch(e){}if(!r.dataset.concept)r.dataset.concept='ink';r.classList.add('has-js');try{var ss=sessionStorage,rm=matchMedia('(prefers-reduced-motion: reduce)').matches;if(ss.getItem('aai-t')){ss.removeItem('aai-t');if(!rm)r.classList.add('arrive')}else if(!rm&&!ss.getItem('aai-seen')&&location.pathname.indexOf('/identity/')<0){r.classList.add('intro-on')}ss.setItem('aai-seen','1')}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<style>
/* homepage: motion is the material. Everything below still reads with motion off. */
.sl { display: flex; gap: 14px; align-items: baseline }
.mega { font-size: clamp(46px, 7.6vw, 132px); font-weight: 600; letter-spacing: -0.04em; line-height: 1.04; text-wrap: balance; max-width: 17ch }
h2.big { font-size: clamp(40px, 6vw, 92px); letter-spacing: -0.035em; line-height: 0.98; max-width: 12ch }
.mega .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.1em; margin-bottom: -0.1em }
.mega .w > span { display: inline-block; animation: rise 1s cubic-bezier(.2, .8, .2, 1) calc(var(--start, .15s) + var(--i) * 70ms) both }
@keyframes rise { from { transform: translateY(105%) } to { transform: none } }
.hero-x { overflow: hidden; position: relative }
.mast { position: relative; min-height: max(760px, calc(100vh - var(--hdr))); min-height: max(760px, calc(100svh - var(--hdr))); display: flex; flex-direction: column; border-bottom: 1px solid var(--line); overflow: hidden }
.mast-3d { position: absolute; inset: 0 }
.mast-3d canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block }
/* the word's own space: generous room under the nav, and a clear gap before the headline */
.mast-stage { position: relative; flex: 1 0 auto; min-height: clamp(200px, 30vh, 420px); margin: clamp(72px, 11vh, 140px) var(--gut) clamp(48px, 7vh, 96px) }
.mast-fallback { position: absolute; left: var(--gut); right: var(--gut); top: clamp(96px, 16vh, 200px) }
.mast-3d.live .mast-fallback { display: none }
.mast::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, var(--bg) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 26%, transparent 48%) }
.mast-txt { position: relative; z-index: 1; width: 100%; box-sizing: border-box; padding-block: 0 clamp(96px, 13vh, 168px) }
.mast .hero-row { margin-bottom: 0 }
@media (max-width: 900px) { .mast { min-height: 0 } .mast-stage { flex: none; min-height: clamp(110px, 26vw, 220px); margin-block: 44px 28px } .mast-fallback { top: 52px } .mast-txt { padding-block: 0 clamp(56px, 10vw, 80px) } }
.hero-x .mega { margin-block: 18px 30px }
.hero-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 48px; margin-bottom: clamp(32px, 4vw, 48px) }
.hero-row .lede { max-width: 40ch }
.ctas { display: flex; flex-wrap: wrap; gap: 12px }
.hf-wrap { position: relative; height: clamp(170px, 18vw, 280px); touch-action: pan-y; border-bottom: 1px solid var(--line) }
.hf { position: absolute; inset: 0; width: 100%; height: 100% }
.hf.base { color: var(--pattern) }
.hf.hi { color: var(--accent); -webkit-mask-image: radial-gradient(circle 0 at 50% 50%, #000, transparent); mask-image: radial-gradient(circle 0 at 50% 50%, #000, transparent); pointer-events: none }
@keyframes plough { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
@keyframes appear { from { opacity: 0 } to { opacity: 1 } }
.hf.base .pf, .hf.base .ps { stroke-dasharray: 1; animation: plough var(--t, .45s) cubic-bezier(.6, 0, .25, 1) calc(var(--start, 0s) + var(--d, 0s)) both }
.hf.base .hh { animation: appear .3s linear calc(var(--start, 0s) + var(--d, 0s)) both }

/* marquee */
.marquee { overflow: hidden; border-block: 1px solid var(--line); padding-block: clamp(14px, 2vw, 26px); white-space: nowrap }
.mq-track { display: inline-flex; will-change: transform }
.mq-set { display: inline-flex; align-items: center; gap: clamp(20px, 3vw, 44px); padding-right: clamp(20px, 3vw, 44px) }
.mq-set span { font-size: clamp(30px, 4.6vw, 72px); font-weight: 600; letter-spacing: -0.035em; line-height: 1 }
.mq-set span:nth-of-type(even) { color: transparent; -webkit-text-stroke: 1.5px var(--fg) }
.mq-set i { width: clamp(28px, 3vw, 44px); height: clamp(10px, 1vw, 14px); background: var(--accent); flex: none }

/* photos: they rest in the brand treatment and bloom into full colour as they scroll into view */
.photo { margin: 0; position: relative; overflow: hidden; background: var(--raised) }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; transition: filter 1.2s cubic-bezier(.2, .8, .2, 1) }
.photo::after { content: ""; position: absolute; inset: 0; background: var(--duo, #111); mix-blend-mode: screen; opacity: 0; transition: opacity 1.2s cubic-bezier(.2, .8, .2, 1); pointer-events: none }
:root[data-concept="cobalt"] { --duo: #1C30D9 }
:root[data-concept="ink"] { --duo: #111111 }
.has-js:not(.no-motion) .photo:not(.in-view) img { filter: grayscale(1) contrast(1.08) }
.has-js:not(.no-motion) .photo:not(.in-view)::after { opacity: 1 }
.float-img .photo img { filter: none !important } .float-img .photo::after { opacity: 0 !important }
.intro { padding-bottom: clamp(72px, 10vw, 140px) }
.intro-img { margin-top: clamp(48px, 6vw, 88px); height: clamp(320px, 52vw, 760px) }
.intro-img .photo, .intro-img .render { height: 100%; clip-path: inset(0 0 0 0) }
.intro-img img { height: 118%; margin-top: -9% }
.row-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: end; gap: 18px 48px }
.row-head .sl { grid-column: 1 / -1 }
@media (max-width: 900px) { .row-head { grid-template-columns: minmax(0, 1fr) } }

/* service index with a cursor-following photo */
.idx li { display: grid; grid-template-columns: 72px minmax(0, 1.1fr) minmax(0, 1fr) 120px; gap: 24px; align-items: center; padding-block: clamp(22px, 2.6vw, 34px); border-top: 1px solid var(--line); transition: background-color .3s, padding .4s cubic-bezier(.2, .8, .2, 1); position: relative }
.idx li:last-child { border-bottom: 1px solid var(--line) }
.idx h3 { font-size: clamp(26px, 3.4vw, 48px); letter-spacing: -0.03em; line-height: 1.02; transition: transform .4s cubic-bezier(.2, .8, .2, 1) }
.idx p { color: var(--body) }
.idx .thumb { display: none }
.ticks { display: flex; gap: 6px; justify-self: end }
.ticks i { width: 8px; height: 40px; background: var(--line); transition: background-color .25s, transform .4s }
.ticks i.on { background: var(--pattern) }
.idx li:hover { background: var(--raised); padding-inline: 20px; --ground: var(--raised) }
.idx li:hover h3 { transform: translateX(10px) }
.idx li:hover .ticks i.on { background: var(--accent); transform: scaleY(1.25) }
.float-img { position: fixed; left: 0; top: 0; width: clamp(240px, 22vw, 360px); aspect-ratio: 4 / 5; pointer-events: none; z-index: 20; opacity: 0; transform: translate3d(-50%, -50%, 0) scale(.6); transition: opacity .3s, scale .3s; will-change: transform }
.float-img.on { opacity: 1 }
.float-img .fi { position: absolute; inset: 0; opacity: 0; transition: opacity .35s }
.float-img .fi.on { opacity: 1 }
@media (max-width: 900px), (pointer: coarse) {
  .idx li { grid-template-columns: 48px minmax(0, 1fr) 72px; gap: 10px 16px } .idx p { grid-column: 2 } .ticks, .float-img { display: none }
  .idx .thumb { display: block; grid-column: 3; grid-row: 1 / span 2; width: 72px; height: 72px; align-self: start }
}

/* stories: pinned, panels travel sideways */
.stories { border-bottom: 1px solid var(--line); overflow: hidden }
.st-pin { padding-block: clamp(72px, 9vw, 120px); min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box }
.st-head { display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; margin-bottom: clamp(32px, 4vw, 56px) }
.st-track { display: flex; gap: clamp(20px, 3vw, 48px); padding-inline: var(--gut); will-change: transform }
.st-panel { flex: none; width: min(1100px, 82vw); display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: clamp(24px, 3vw, 48px); align-items: stretch; margin: 0 }
.st-img { aspect-ratio: 4 / 5; max-width: 100% }
.st-txt { display: flex; flex-direction: column; justify-content: space-between; gap: 28px; padding-block: 8px; min-width: 0 }
.st-txt blockquote { font-size: clamp(26px, 3.2vw, 50px); font-weight: 500; letter-spacing: -0.025em; line-height: 1.12; text-wrap: pretty }
.st-txt figcaption { display: flex; align-items: center; gap: 16px }
.st-txt .sym { width: 44px }
.st-hint { display: none }
.pin-on .st-hint { display: block }
@media (max-width: 900px) {
  .st-pin { min-height: 0 } .st-track { flex-direction: column; padding-inline: var(--gut) }
  .st-panel { width: auto; grid-template-columns: minmax(0, 1fr) } .st-img { aspect-ratio: 16 / 10 }
}

/* bots: bento with tilt and a light that follows the cursor */
.bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px; perspective: 1200px }
.bot { position: relative; border: 1px solid var(--line); background: var(--raised); --ground: var(--raised); display: flex; flex-direction: column; justify-content: space-between; gap: 32px; padding: clamp(24px, 3vw, 36px); min-height: 340px; overflow: hidden; min-width: 0; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2, .8, .2, 1) }
.bot.b0, .bot.b3 { grid-column: span 4 } .bot.b1, .bot.b2 { grid-column: span 2 }
.bot.has-img { justify-content: flex-end; color: #fff }
.bot.has-img .num, .bot.has-img p { color: rgba(255, 255, 255, .82) }
.bot .bot-img { position: absolute; inset: 0; transition: transform 1.2s cubic-bezier(.2, .8, .2, 1) }
.bot .bot-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, .78), rgba(0, 0, 0, 0) 62%) }
.bot.has-img:hover .bot-img { transform: scale(1.05) }
.bot-txt { position: relative; display: flex; flex-direction: column; gap: 12px; max-width: 34ch }
.bot h3 { font-size: clamp(24px, 2.4vw, 34px); letter-spacing: -0.02em }
.bot p { color: var(--body) }
.bot-art { display: flex; justify-content: flex-end; align-items: flex-end; min-width: 0 }
.bot-art svg { height: clamp(96px, 10vw, 150px); width: auto; max-width: 100%; color: var(--accent) }
.glare { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; background: radial-gradient(circle 280px at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, .18), transparent 70%); z-index: 1 }
.bot:hover .glare { opacity: 1 }
.bot .furrow, .bot .crossrun { animation: none; stroke-dashoffset: 0 }
.bot .hair { animation: none; opacity: 1 }
.bot:hover .furrow { animation: ai-furrow 4.6s cubic-bezier(.55,0,.3,1) infinite }
.bot:hover .crossrun { animation: ai-cross 4.6s cubic-bezier(.55,0,.3,1) infinite }
.bot:hover .hair { animation: ai-hair 4.6s linear infinite }
@media (max-width: 1000px) { .bento { grid-template-columns: minmax(0, 1fr) } .bot.b0, .bot.b1, .bot.b2, .bot.b3 { grid-column: auto } .bot { min-height: 300px } }

/* leaders */
.lead-side { position: sticky; top: calc(var(--hdr) + 40px) }
.lead-img { aspect-ratio: 4 / 3; margin-top: 12px; max-width: 100% }
.leaders li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; padding-block: 30px; border-top: 1px solid var(--line); align-items: baseline; opacity: .38; transition: opacity .5s }
.leaders li.lit, .no-motion .leaders li { opacity: 1 }
.leaders li:last-child { border-bottom: 1px solid var(--line) }
.leaders p { font-size: clamp(20px, 2.1vw, 28px); letter-spacing: -0.01em; line-height: 1.28 }
@media (max-width: 900px) { .lead-side { position: static } .leaders li { opacity: 1 } }

/* call */
.call { background: var(--accent); color: var(--bg); --ground: var(--accent); padding-block: clamp(72px, 9vw, 128px); scroll-margin-top: var(--hdr) }
.call .lab, .call .lede, .call .num { color: var(--bg) }
.call .btn { background: var(--bg); color: var(--fg); border-color: var(--bg) }
.call-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: end }
.call-big { display: flex; flex-direction: column; font-size: clamp(64px, 11vw, 188px); font-weight: 600; letter-spacing: -0.05em; line-height: 0.86; text-align: right; font-variant-numeric: tabular-nums }
@media (max-width: 900px) { .call-grid { grid-template-columns: minmax(0, 1fr) } .call-big { text-align: left } }

/* Timor-Leste */
.timor { position: relative; border-bottom: 1px solid var(--line); scroll-margin-top: var(--hdr) }
.timor-img { height: clamp(440px, 60vw, 820px); overflow: hidden }
.timor-img .photo { height: 100% }
.timor-img img { transform-origin: 50% 60% }
.timor .wrap { position: relative; margin-top: calc(-1 * clamp(200px, 22vw, 320px)); padding-bottom: clamp(64px, 8vw, 120px) }
.timor-card { background: var(--bg); border: 1px solid var(--line); padding: clamp(28px, 4vw, 56px); max-width: 640px; display: flex; flex-direction: column; gap: 24px }

/* videos: drag to scroll */
.videos { display: flex; gap: 20px; overflow-x: auto; padding-inline: var(--gut); padding-bottom: 14px; scrollbar-width: none; cursor: grab; user-select: none }
.videos::-webkit-scrollbar { display: none }
.videos.dragging { cursor: grabbing; scroll-snap-type: none }
.video { flex: none; width: clamp(300px, 36vw, 560px); display: flex; flex-direction: column; gap: 14px }
.vthumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid var(--line) }
.vthumb .photo { position: absolute; inset: 0; transition: transform .9s cubic-bezier(.2, .8, .2, 1) }
.video:hover .vthumb .photo { transform: scale(1.06) }
.vthumb img { pointer-events: none }
.vnum { position: absolute; left: 14px; top: 12px; color: #fff }
.video .play { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 64px; height: 64px; border-radius: 50%; background: #fff; display: grid; place-items: center; transition: scale .3s cubic-bezier(.2, .8, .2, 1) }
.video:hover .play { scale: 1.15 }
.video .play::after { content: ""; border-left: 16px solid #111; border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 4px }
.video h3 { font-size: 20px }
@media (max-width: 700px) { .video { width: 84vw } }

/* contact, subscribe */
.details { display: flex; flex-direction: column; gap: 6px; margin-top: 8px }
.details p:not(.lab) { font-size: clamp(22px, 2.4vw, 30px); font-weight: 500; letter-spacing: -0.01em }
form.drop { border: 1px solid var(--line); padding: clamp(24px, 3vw, 40px); display: flex; flex-direction: column; gap: 22px }
.subscribe { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 48px }
.subscribe form { display: flex; gap: 16px; align-items: flex-end; flex: 1; max-width: 560px; min-width: min(100%, 320px) }
.subscribe .field { flex: 1 }

/* footer: a spotlight follows the cursor across the wordmark */
.big-foot { padding-block: clamp(56px, 8vw, 104px) 40px }
.big-foot .wrap { display: block }
.foot-wm-wrap { position: relative }
.foot-wm { width: 100% !important; background: var(--line) }
.foot-hi { position: absolute; inset: 0; background: var(--fg); -webkit-mask: url(assets/wordmark.png) center / contain no-repeat, radial-gradient(circle clamp(120px, 14vw, 240px) at var(--fx, -999px) var(--fy, -999px), #000 0, #000 30%, transparent 100%); -webkit-mask-composite: source-in; mask: url(assets/wordmark.png) center / contain no-repeat, radial-gradient(circle clamp(120px, 14vw, 240px) at var(--fx, -999px) var(--fy, -999px), #000 0, #000 30%, transparent 100%); mask-composite: intersect }
@media (pointer: coarse) { .foot-wm { background: var(--fg) } .foot-hi { display: none } }
.foot-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 32px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line) }
.foot-row p { color: var(--mute); font-size: 15px; max-width: 48ch }
.foot-row .sym { width: 56px }

/* cursor, progress, magnetic buttons */
.cursor { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; display: none }
.has-cursor .cursor { display: block }
.cur-ring { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border: 1.5px solid var(--fg); border-radius: 50%; transition: width .35s, height .35s, margin .35s, background-color .35s, border-color .35s; mix-blend-mode: difference; border-color: #fff }
.cursor.big .cur-ring { width: 84px; height: 84px; margin: -42px 0 0 -42px; background: #fff }
.cursor.link .cur-ring { width: 56px; height: 56px; margin: -28px 0 0 -28px }
.cur-lab { position: absolute; transform: translate(-50%, -50%); font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #111; opacity: 0; transition: opacity .25s; white-space: nowrap }
.cursor.big .cur-lab { opacity: 1 }
.mag { transition: transform .5s cubic-bezier(.2, .8, .2, 1), opacity .2s }

.veil.intro { display: none }
.intro-on .veil.intro { display: grid; animation: wipe-up .8s cubic-bezier(.7, 0, .2, 1) 1.55s both }
.veil.intro .furrow, .veil.intro .crossrun, .veil.intro .hair { animation-iteration-count: 1; animation-fill-mode: both; animation-duration: 2.2s }
.intro-on { --start: 1.9s }
.arrive { --start: .35s }

@media (prefers-reduced-motion: reduce) {
  .mega .w > span { animation: none }
  .hf.base .pf, .hf.base .ps { animation: none; stroke-dashoffset: 0 } .hf.base .hh { animation: none; opacity: 1 }
  .hf.hi, .veil, .cursor, .float-img { display: none !important }
  .rowg, .idx li, .idx h3, .bot, .mag, .ticks i { transition: none }
  .leaders li { opacity: 1 }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="../../" data-nav aria-label="Actualise AI home"><span class="wm" role="img" aria-label="Actualise AI"></span></a>
    <nav class="primary" aria-label="Primary"><a href="../../" data-nav>Home</a><a href="../../identity/" data-nav>Brand identity</a></nav>
    <div class="controls">
      <div class="concepts" role="group" aria-label="Colour concept"><button type="button" data-concept="ink" aria-pressed="false" title="Ink colour concept"><span class="dot" style="background: linear-gradient(135deg, #111111 50%, #D2DAEE 50%)"></span><span class="nm">Ink</span></button><button type="button" data-concept="cobalt" aria-pressed="false" title="Cobalt colour concept"><span class="dot" style="background: linear-gradient(135deg, #1C30D9 50%, #FFFFFF 50%)"></span><span class="nm">Cobalt</span></button></div>
      <button type="button" class="mode" id="mode" aria-label="Switch colour mode"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg><span class="nm">Dark</span></button>
    </div>
  </div>
  
</header><main id="top"><section class="hero-x"><div class="mast"><div class="mast-3d" aria-hidden="true"><div class="mast-fallback"><span class="wm" role="img" aria-label="Actualise AI"></span></div></div><div class="mast-stage" aria-hidden="true"></div><div class="wrap mast-txt"><p class="lab sl"><span class="num">00</span>Optimise your potential with AI</p><h1 class="mega">Reimagine Speed to Execution™</h1><div class="hero-row"><p class="lede">with Actualise AI. We empower business leaders to work smarter, not harder.</p><div class="ctas"><a class="btn" href="../../" data-nav>Back to the homepage</a></div></div></div></div></section></main>
<script src="../../assets/site.js"></script>
<script type="module" src="../../assets/hero3d.js"></script>
</body>
