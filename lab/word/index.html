  .st-track { flex-direction: column; padding-inline: var(--gut) }

}

/* how it works */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); counter-reset: s }
.steps li { display: flex; flex-direction: column; gap: 14px; padding: clamp(24px, 3vw, 40px) clamp(20px, 2.4vw, 32px) clamp(24px, 3vw, 40px) 0; border-right: 1px solid var(--line); min-width: 0 }

/* bots: bento with tilt and a light that follows the cursor */
.bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px; perspective: 1200px }
.bot { position: relative; border: 1px solid var(--line); background: var(--raised); --ground: var(--raised); display: flex; flex-direction: column; justify-content: space-between; gap: 32px; padding: clamp(24px, 3vw, 36px); min-height: 340px; overflow: hidden; min-width: 0; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2, .8, .2, 1) }
.bot.b0, .bot.b3 { grid-column: span 4 } .bot.b1, .bot.b2 { grid-column: span 2 }

.bot-txt { position: relative; display: flex; flex-direction: column; gap: 12px; max-width: 34ch }
.bot h3 { font-size: clamp(24px, 2.4vw, 34px); letter-spacing: -0.02em }
.bot p { color: var(--body) }
.bot-art { display: flex; justify-content: flex-end; align-items: flex-end; min-width: 0 }
.bot-art svg { height: clamp(96px, 10vw, 150px); width: auto; max-width: 100%; color: var(--accent) }
.glare { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; background: radial-gradient(circle 280px at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, .18), transparent 70%); z-index: 1 }
.bot:hover .glare { opacity: 1 }
.bot .furrow, .bot .crossrun { animation: none; stroke-dashoffset: 0 }

.bot:hover .furrow { animation: ai-furrow 4.6s cubic-bezier(.55,0,.3,1) infinite }

/* leaders */
.lead-side { position: sticky; top: calc(var(--hdr) + 40px) }
.lead-img { aspect-ratio: 4 / 3; margin-top: 12px; max-width: 100% }

.timor-img { height: clamp(440px, 60vw, 820px); overflow: hidden }
.timor-img .photo { height: 100% }
.timor-img img { transform-origin: 50% 60% }
.timor .wrap { position: relative; margin-top: calc(-1 * clamp(200px, 22vw, 320px)); padding-bottom: clamp(64px, 8vw, 120px) }
.timor-card { background: var(--bg); border: 1px solid var(--line); padding: clamp(28px, 4vw, 56px); max-width: 640px; display: flex; flex-direction: column; gap: 24px }

/* gallery: an editorial grid with a line for each picture */
.gal { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: clamp(28px, 3vw, 40px) clamp(16px, 2vw, 28px) }
.g { display: flex; flex-direction: column; gap: 14px; margin: 0; min-width: 0 }
.g0 { grid-column: span 7 } .g1 { grid-column: span 5 } .g2 { grid-column: span 5 } .g3 { grid-column: span 7 } .g4 { grid-column: span 6 } .g5 { grid-column: span 6 }
.g-img { aspect-ratio: 16 / 10; overflow: hidden }
.g1 .g-img, .g2 .g-img { aspect-ratio: 4 / 3 }
.g-img img { transition: transform 1.2s cubic-bezier(.2, .8, .2, 1), filter 1.2s cubic-bezier(.2, .8, .2, 1) }
.g:hover .g-img img { transform: scale(1.04) }
.g figcaption { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 12px; align-items: baseline }
.g figcaption p { grid-column: 2; color: var(--body); font-size: 15px; max-width: 46ch }
.g h3 { font-size: 20px }
.gal-note { margin-top: 32px }
@media (max-width: 900px) { .g0, .g1, .g2, .g3, .g4, .g5 { grid-column: 1 / -1 } .g-img, .g1 .g-img, .g2 .g-img { aspect-ratio: 16 / 10 } }

/* questions */
.faq-side { position: sticky; top: calc(var(--hdr) + 40px) }
.faq details { border-top: 1px solid var(--line) }
.faq details:last-child { border-bottom: 1px solid var(--line) }
.faq summary { display: grid; grid-template-columns: 48px minmax(0, 1fr) 20px; gap: 12px; align-items: baseline; padding-block: 24px; cursor: pointer; list-style: none; font-size: clamp(19px, 1.8vw, 24px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.25 }
.faq summary::-webkit-details-marker { display: none }
.faq summary i { position: relative; width: 14px; height: 14px; align-self: center }
.faq summary i::before, .faq summary i::after { content: ""; position: absolute; left: 0; top: 6px; width: 14px; height: 2px; background: var(--fg); transition: transform .3s }
.faq summary i::after { transform: rotate(90deg) }
.faq details[open] summary i::after { transform: rotate(0deg) }
.faq details p { color: var(--body); padding: 0 32px 26px 60px; max-width: 62ch }
@media (max-width: 900px) { .faq-side { position: static } .faq details p { padding-left: 0 } }

/* contact, subscribe */
.details { display: flex; flex-direction: column; gap: 6px; margin-top: 8px }
.details p:not(.lab) { font-size: clamp(22px, 2.4vw, 30px); font-weight: 500; letter-spacing: -0.01em }
form.drop { border: 1px solid var(--line); padding: clamp(24px, 3vw, 40px); display: flex; flex-direction: column; gap: 22px }
fieldset.field { border: 0; margin: 0; padding: 0; min-width: 0 }
fieldset.field legend { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); padding: 0; margin-bottom: 8px }
.pick .seg { flex-wrap: wrap } .pick label { flex: 1; cursor: pointer; display: flex } .pick label + label { border-left: 1px solid var(--line) }
.pick input { position: absolute; opacity: 0; pointer-events: none }
.pick span { flex: 1; text-align: center; font: 500 12px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--mute); padding: 12px 10px; white-space: nowrap }
.pick input:checked + span { background: var(--fg); color: var(--bg) }
.pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px }
.field textarea { font: 17px/1.4 var(--sans); color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; resize: vertical; border-radius: 0 }
.field textarea:focus { outline: none; border-bottom-color: var(--fg) }
.subscribe { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 48px }
.subscribe form { display: flex; gap: 16px; align-items: flex-end; flex: 1; max-width: 560px; min-width: min(100%, 320px) }
.subscribe .field { flex: 1 }

/* footer: a spotlight follows the cursor across the wordmark */
.big-foot { padding-block: clamp(56px, 8vw, 104px) 40px }
.big-foot .wrap { display: block }
.foot-wm-wrap { position: relative }
.foot-wm { width: 100% !important; background: var(--line) }
.foot-hi { position: absolute; inset: 0; background: var(--fg); -webkit-mask: url(assets/wordmark.png) center / contain no-repeat, radial-gradient(circle clamp(120px, 14vw, 240px) at var(--fx, -999px) var(--fy, -999px), #000 0, #000 30%, transparent 100%); -webkit-mask-composite: source-in; mask: url(assets/wordmark.png) center / contain no-repeat, radial-gradient(circle clamp(120px, 14vw, 240px) at var(--fx, -999px) var(--fy, -999px), #000 0, #000 30%, transparent 100%); mask-composite: intersect }
@media (pointer: coarse) { .foot-wm { background: var(--fg) } .foot-hi { display: none } }
.foot-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 32px; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line) }
.foot-row p { color: var(--mute); font-size: 15px; max-width: 48ch }
.foot-row .sym { width: 56px }

/* cursor, progress, magnetic buttons */
.cursor { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; display: none }
.has-cursor .cursor { display: block }
.cur-ring { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border: 1.5px solid var(--fg); border-radius: 50%; transition: width .35s, height .35s, margin .35s, background-color .35s, border-color .35s; mix-blend-mode: difference; border-color: #fff }
.cursor.big .cur-ring { width: 84px; height: 84px; margin: -42px 0 0 -42px; background: #fff }
.cursor.link .cur-ring { width: 56px; height: 56px; margin: -28px 0 0 -28px }
.cur-lab { position: absolute; transform: translate(-50%, -50%); font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #111; opacity: 0; transition: opacity .25s; white-space: nowrap }
.cursor.big .cur-lab { opacity: 1 }
.mag { transition: transform .5s cubic-bezier(.2, .8, .2, 1), opacity .2s }

.veil.intro { display: none }
.intro-on .veil.intro { display: grid; animation: wipe-up .8s cubic-bezier(.7, 0, .2, 1) 5.6s both; pointer-events: auto; cursor: pointer }
.veil.intro > * { grid-area: 1 / 1 }
/* the AI mark ploughs on, fades; the wordmark fades in and holds for three seconds; then the wipe */
.veil-mark { animation: veil-out .5s ease 1.5s both }
.veil-wm { width: min(78vw, 560px); animation: veil-in .6s ease 2s both }
@keyframes veil-out { to { opacity: 0; transform: scale(.96) } }
@keyframes veil-in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
.intro-on .veil.intro.skip { animation: wipe-up .5s cubic-bezier(.7, 0, .2, 1) 0s both }
.veil.intro .furrow, .veil.intro .crossrun, .veil.intro .hair { animation-iteration-count: 1; animation-fill-mode: both; animation-duration: 2.2s }
.intro-on { --start: 5.9s }
.arrive { --start: .35s }

@media (prefers-reduced-motion: reduce) {
  .mega .w > span { animation: none }
  .hf.base .pf, .hf.base .ps { animation: none; stroke-dashoffset: 0 } .hf.base .hh { animation: none; opacity: 1 }
  .hf.hi, .veil, .cursor { display: none !important }
  .rowg, .bot, .mag, .opt, .q-bar i { transition: none }
  .leaders li { opacity: 1 }
}
